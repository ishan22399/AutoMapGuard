spring:
  application:
    name: automapguard-backend
  
  jpa:
    hibernate:
      ddl-auto: validate  # Use 'create-drop' for testing, 'validate' for production
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/automapguard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  sql:
    init:
      mode: always  # Initialize database on startup
  
  web:
    cors:
      allowed-origins: http://localhost:3000,http://localhost:5173

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-this-in-production-at-least-32-characters-long}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours

logging:
  level:
    root: INFO
    com.automapguard: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
